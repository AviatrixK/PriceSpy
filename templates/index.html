  <script>
    function sendOTP() {
        let email = document.getElementById("email").value;

        fetch("/send-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        })
        .then(response => {
            if (response.ok) {
                document.getElementById("otp-message").innerText = "OTP sent! Check your email.";
                document.getElementById("verify-otp").style.display = "block";
            } else {
                document.getElementById("otp-message").innerText = "Failed to send OTP.";
            }
        })
        .catch(error => console.log(error));
    }

    function verifyOTP() {
        let email = document.getElementById("email").value;
        let otp = document.getElementById("otp").value;

        fetch("/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, otp: otp })
        })
        .then(response => {
            if (response.status === 200) {
                document.getElementById("auth_message").innerText = "OTP Verified Successfully!";
            } else if (response.status === 401) {
                document.getElementById("auth_message").innerText = "Invalid OTP. Try again.";
            } else if (response.status === 410) {
                document.getElementById("auth_message").innerText = "OTP Expired. Request a new one.";
            } else {
                document.getElementById("auth_message").innerText = "Error verifying OTP.";
            }
        })
        .catch(error => console.log(error));
    }
</script>
