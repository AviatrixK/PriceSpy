  <script>
    function searchTerm() {
      let searchQ = document.getElementById("searchField").value;

      //     fetch("/amzn?searchQuery="+searchQ, {
      //         method: "GET",
      //         headers: { "Content-Type": "application/json" },
      //         // body: JSON.stringify({ searchQuery : searchQ })
      //     })
      //     .then(response => {
      //         // if (response.ok) {
      //         //     document.getElementById("otp-message").innerText = "OTP sent! Check your email.";
      //         //     document.getElementById("verify-otp").style.display = "block";
      //         // } else {
      //         //     document.getElementById("otp-message").innerText = "Failed to send OTP.";
      //         // }
      //         console.log("Response")
      //         console.log(response)
      //     })
      //     .catch(error => console.log(error));
      // }
      fetch("/amzn?searchQuery=" + searchQ, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      })
        .then(response => response.json())
        .then(result => {
          console.log("Full parsed result:", result);

          const shopCluesData = JSON.parse(result.data.shopClues); // <-- important: parse it
          const snapDealData = JSON.parse(result.data.snapDeal);   // <-- important: parse it

          console.log("shopClues products:", shopCluesData);
          console.log("snapDeal products:", snapDealData);
          document.getElementById("prod_cards").innerHTML = "";

          // Now you can loop and create cards for each product
          shopCluesData.forEach(product => {
            createProductCard(product);
          });

          snapDealData.forEach(product => {
            createProductCard(product);
          });

        })
        .catch(error => {
          console.error("Error fetching data:", error);
        });
    }

    const searchField = document.querySelector('#searchField');
    searchField.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        searchTerm();
      }
    });

    function createProductCard(product) {
      const card = document.createElement("div");
      card.className = "card";
      const inputText = searchField.value.trim();
      const catg_temp = inputText.split(' ')[0];

      card.innerHTML = `
      <div class="product_img">
        <img src="${product.img.startsWith('http') ? product.img : 'https:' + product.img}" alt="Product Image">
      </div>
      <div class="category">
        ${catg_temp}
        </div>
      <div class="info">
        <p>${product.name}</p>
      </div>
      <div class="prc_info">
        <div class="best_p">Best Price <p class="best_site">ShopClues / SnapDeal</p></div>
        <div class="rupee">₹<span class="price">${product.price.replace(/\D/g, '')}</span></div>
      </div>
      <button class="onsite">Visit site <img src="/static/images/svg/link.svg" alt=""></button>
    `;

      document.getElementById("prod_cards").appendChild(card);
    }
    const reload = document.querySelector('#reload_bttn');

    reload.addEventListener('click', function () {
      reload.classList.add('reloadts');

      reload.addEventListener('animationend', function handler() {
        reload.classList.remove('reloadts');
        reload.removeEventListener('animationend', handler); // Clean up
      });
    });
const arrow_dwn = document.querySelector('.drp');
const drop_down = document.querySelector('.drop-down');
const drp_list = document.querySelector('.drp_list')
const list_items = document.querySelectorAll('.drp_list li');
const ctxt = document.querySelector('.catxt')

drop_down.addEventListener('click', function(e) {
  e.stopPropagation();
  arrow_dwn.classList.toggle('rotate');
  drp_list.classList.toggle('show')
});

document.addEventListener('click', function(){
  arrow_dwn.classList.remove('rotate');
  drp_list.classList.remove('show')
});

list_items.forEach(function(item) {
  item.addEventListener('click', function() {
    ctxt.innerText = item.textContent;
    if (item.textContent.length > 5) {
      ctxt.style.fontSize = '1rem'
    } else {
      ctxt.style.fontSize = '1.4rem'
    }
  });
});
