<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Price Spy will provide you the lowest prices for the products you are looking for">
    <meta name="keywords"
        content="low prices, best deals, price comparison, affordable price, discount finder, online shopping, best offers, save money, product prices, price tracker">
    <title>PriceSpy - Shop Smarter</title>
    <link rel="stylesheet" href="landing.css">
</head>

<body>
    <nav>
        <ul>
            <li id="logo"><a href="landingPage.html">Price Spy</a></li>
            <li><button id="sign-in">Sign in</button></li>
        </ul>
    </nav>
    <main id="hero">
        <div class="hero_txt">
            <h1 class="head_h">Tired of Switching Between <center>E-Commerce sites?</center>
            </h1>
            <p class="para_h">Let <span class="blue">Price Spy</span> do the hard work for you! Compare prices across
                platforms in seconds and <span class="blue">shop smarter</span>.</p>
            <div class="start-btn">
                <button id="getstart">Get Started <img id="arrow" src="/assets/svg/Arrow.svg"></button>
            </div>
        </div>
        <div class="hero_img">
            <img width="500px" src="/assets/img/HeroMain.png" alt="People searching for great deals">
        </div>
    </main>
    <section id="cards">
        <div class="c-txt">
            <h2 class="c-head">Your One-Stop Solution for <span class="blue">Smarter Online Shopping</span></h2>
        </div>
        <div class="tri-cards">
            <div class="card-one"></div>
            <div class="card-two"></div>
            <div class="card-three"></div>
        </div>
    </section>
    <script src="landing.js"></script>
</body>

</html>
